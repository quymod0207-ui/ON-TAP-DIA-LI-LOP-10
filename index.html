<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn Tập Giữa Học Kì Lớp 10</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020711;color:#eef7ff;font:14px Arial,sans-serif;min-height:100vh}
canvas#bg{position:fixed;inset:0;z-index:-1}

/* CSS Chọn môn */
#subject-select{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}
#subject-select h1{
  font-size:clamp(24px,5vw,36px);
  color:#fff;
  text-shadow:0 0 18px #00dfff;
  margin-bottom:30px;
  text-align:center;
}
.subject-grid{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:15px;
  width:min(1000px, 100%);
}
.sub-card{
  background:#071425dd;
  border-radius:16px;
  padding:25px 15px;
  text-align:center;
  font-weight:bold;
  font-size:15px;
  box-shadow:0 8px 30px #0008;
  backdrop-filter:blur(7px);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:120px;
  transition:transform 0.2s, box-shadow 0.2s;
}
.sub-card.disabled{
  border:2px solid #ff304e;
  background:linear-gradient(145deg, #d32145, #690e23);
  color:#fff;
  opacity:0.8;
  cursor:not-allowed;
}
.sub-card.active{
  border:2px solid #00ff9a;
  background:linear-gradient(145deg, #00d88c, #08785f);
  color:#fff;
  cursor:pointer;
  box-shadow:0 0 20px #00ff9a44;
}
.sub-card.active:hover{
  transform:translateY(-5px);
  box-shadow:0 0 30px #00ff9a88;
}

/* CSS Nội dung */
#main-content{ display:none; }
header{text-align:center;padding:25px 12px 12px}
h1{font-size:clamp(23px,6vw,38px);margin:5px;color:#fff;text-shadow:0 0 18px #00dfff}
.name{display:inline-block;margin-top:12px;padding:9px 14px;border:1px solid #24466a;border-radius:30px;background:#071322cc;color:#00e5ff;font-weight:bold}
.wrap{width:min(1050px,94%);margin:auto}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}
.nav button{border:0;border-radius:16px;padding:17px 7px;color:#fff;font-weight:bold;background:linear-gradient(145deg,#d32145,#690e23);cursor:pointer}
.nav button.on{background:linear-gradient(145deg,#00d88c,#08785f);box-shadow:0 0 22px #00ff9a44}
.page{display:none;padding-bottom:45px}
.page.on{display:block}
.card{background:#071425dd;border:1px solid #183756;border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 8px 30px #0008;backdrop-filter:blur(7px)}
.q{font-weight:bold;line-height:1.55;margin-bottom:9px;font-size:15px;color:#fff}
.opts{display:grid;gap:6px;color:#c9d8e9}
.opt{padding:8px 10px;border-radius:9px;background:#051222;border:1px solid #18334e}
.opt.correct{border:2px solid #00ff9a;background:#00ff9a15;color:#fff;box-shadow:0 0 13px #00ff9a55;font-weight:bold}
.row{display:flex;gap:9px;align-items:center;margin-top:10px;flex-wrap:wrap}
.key{background:#081727;color:#00e5ff;border:1px solid #385878;border-radius:11px;padding:8px 12px;font-size:14px;font-weight:bold;cursor:pointer;transition:0.2s}
.key:hover{border-color:#00e5ff;background:#0f2a47}
.ans{display:none;color:#35ff99;font-weight:800;width:100%}
.ans.show{display:block}
.explain{margin-top:10px;padding:12px;background:#030f1ebd;border-left:4px solid #00e5ff;border-radius:0 8px 8px 0;color:#c3f3ff;font-weight:normal;font-size:13.5px;line-height:1.6}
.explain b{color:#00ff9a}
.tf{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #12283f}
.mark{font-size:18px;font-weight:900}
.t{color:#28f58e}
.f{color:#ff4c6b}
.iv{line-height:1.6;color:#a8efff}
.title{border-left:5px solid #00e5ff;padding-left:10px;color:#00e5ff;margin-top:25px}
.small{font-size:12px;color:#8ea5be}
.chart-container{margin-top:15px;background:#030b14;border:1px solid #1f4268;border-radius:12px;padding:15px;text-align:center;overflow-x:auto}
.chart-canvas{background:#051120;border-radius:8px;max-width:100%;height:auto}

@media(max-width:768px){.subject-grid{grid-template-columns:repeat(2, 1fr);}}
@media(max-width:650px){.nav{grid-template-columns:1fr}.card{padding:12px}.subject-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- MÀN HÌNH CHỌN MÔN -->
<div id="subject-select">
  <h1>CHỌN MÔN HỌC ÔN TẬP</h1>
  <div class="subject-grid">
    <div class="sub-card active" onclick="selectSubject()">Ôn Tập Giữa Học Kì Địa Lí 10</div>
    <div class="sub-card disabled">CHƯA CẬP NHẬT THÊM MÔN HỌC</div>
  </div>
</div>

<!-- NỘI DUNG CHÍNH -->
<div id="main-content">
  <header>
    <h1>Ôn Tập Giữa Học Kì Địa Lí 10</h1>
    <div class="name">[ CHÚC BẠN CÓ BUỔI HỌC TỐT ]</div>
  </header>
  <main class="wrap">
    <div class="nav">
      <button class="on" onclick="pg(1,this)">📘 PHẦN I<br><span class="small">40 câu trắc nghiệm</span></button>
      <button onclick="pg(2,this)">🧩 PHẦN II + III<br><span class="small">Đúng/Sai và Trả lời ngắn</span></button>
      <button onclick="pg(3,this)">📊 PHẦN IV<br><span class="small">Vẽ biểu đồ tự luận</span></button>
    </div>
    <section id="p1" class="page on">
      <h2 class="title">Phần I — Trắc nghiệm </h2>
      <div id="one"></div>
    </section>
    <section id="p2" class="page">
      <h2 class="title">Phần II — Trắc nghiệm Đúng / Sai</h2>
      <div id="two"></div>
      <h2 class="title">Phần III — Trả lời ngắn</h2>
      <div id="three"></div>
    </section>
    <section id="p3" class="page">
      <h2 class="title">Phần IV — Tự luận</h2>
      <div id="four"></div>
    </section>
  </main>
</div>

<script>
function selectSubject(){
  document.getElementById('subject-select').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  scrollTo({top:0, behavior:'smooth'});
}

// DỮ LIỆU PHẦN I: [Câu hỏi, [Các lựa chọn], Đáp án, Lời giải chi tiết]
const Q=[
['Phương pháp khoanh vùng cho biết',['vùng phân bố của đối tượng riêng lẻ.','số lượng của đối tượng riêng lẻ.','tính phổ biến của đối tượng riêng lẻ.','cơ cấu của đối tượng riêng lẻ.'],'A','Phương pháp khoanh vùng (khoanh khoảnh) dùng để thể hiện không gian phân bố của những đối tượng địa lí tập trung thành từng vùng diện tích riêng biệt.'],
['Để thể hiện hướng di chuyển của gió trên bản đồ cần phải dùng phương pháp nào sau đây?',['Kí hiệu.','Chấm điểm.','Bản đồ biểu đồ.','Kí hiệu đường chuyển động.'],'D','Phương pháp kí hiệu đường chuyển động biểu hiện hướng, khối lượng và tốc độ di chuyển của các hiện tượng địa lí tự nhiên và kinh tế - xã hội (gió, dòng biển, luồng di dân...).'],
['Phương pháp kí hiệu dùng để thể hiện các đối tượng',['phân bố theo những điểm cụ thể.','di chuyển theo các hướng bất kì.','phân bố phân tán, lẻ tẻ, rời rạc.','tập trung thành vùng rộng lớn.'],'A','Phương pháp kí hiệu đặt các kí hiệu đúng vào vị trí phân bố thực tế của đối tượng tại những điểm cụ thể (mỏ khoáng sản, hải cảng, đô thị...).'],
['Phương pháp chấm điểm dùng để thể hiện các hiện tượng',['phân bố theo những điểm cụ thể.','di chuyển theo các hướng bất kì.','phân bố phân tán, lẻ tẻ, rời rạc.','tập trung thành vùng rộng lớn.'],'C','Phương pháp chấm điểm dùng từng chấm nhỏ (có giá trị chỉ một số lượng đối tượng nhất định) để biểu hiện sự phân bố phân tán, rời rạc (dân cư nông thôn, diện tích gieo trồng...).'],
['Để thể hiện sự phân bố dân cư trên bản đồ người ta thường dùng phương pháp',['kí hiệu.','nền chất lượng.','chấm điểm.','bản đồ - biểu đồ.'],'C','Mỗi chấm tròn tượng trưng cho một số lượng người nhất định giúp người xem hình dung được độ dày đặc hay thưa thớt của dân cư.'],
['Để tính được khoảng cách thực tế của hai địa điểm trên bản đồ phải căn cứ vào',['tỉ lệ bản đồ.','các kinh tuyến.','các vĩ tuyến.','kí hiệu bản đồ.'],'A','Tỉ lệ bản đồ cho biết khoảng cách trên bản đồ đã thu nhỏ bao nhiêu lần so với khoảng cách thực địa.'],
['Để xác định vị trí của một người, một vật hay một địa điểm trên bản đồ chủ yếu dựa vào',['phương hướng trên bản đồ.','hệ thống kí hiệu của bản đồ.','hệ thống kinh, vĩ tuyến.','kim chỉ hướng bắc của bản đồ.'],'C','Giao điểm giữa kinh tuyến và vĩ tuyến tạo thành tọa độ địa lí để xác định chính xác vị trí mọi điểm.'],
['Kí hiệu của bản đồ dùng để thể hiện',['các đối tượng địa lí trên bản đồ.','tỉ lệ của bản đồ so với thực tế.','hệ thống đường kinh, vĩ tuyến.','bảng chú giải của một bản đồ.'],'A','Kí hiệu bản đồ đóng vai trò như ngôn ngữ bản đồ, dùng thể hiện vị trí, đặc tính của các đối tượng.'],
['Muốn tìm hiểu được nội dung của bản đồ, trước hết cần phải nghiên cứu kĩ phần',['chú giải và kí hiệu.','kí hiệu và vĩ tuyến.','vĩ tuyến và kinh tuyến.','kinh tuyến và chú giải.'],'A','Bảng chú giải chứa các kí hiệu và giải thích ý nghĩa của từng hình vẽ, màu sắc trên bản đồ.'],
['Trong học tập địa lí, khi sử dụng bản đồ, vấn đề cần lưu ý đầu tiên là',['chọn bản đồ phù hợp với nội dung.','đọc kĩ bảng chú giải.','xác định phương hướng trên bản đồ.','nắm được tỉ lệ bản đồ.'],'A','Phải chọn đúng bản đồ liên quan đến chủ đề cần học (ví dụ: học địa hình thì dùng bản đồ tự nhiên, không chọn bản đồ hành chính).'],
['GPS xác định chính xác vị trí của vật thể dựa vào',['quỹ đạo chuyển động của Trái Đất.','các trạm theo dõi và quan sát.','hệ thống các vệ tinh nhân tạo.','thiết bị xử lí thông tin vật thể.'],'C','Hệ thống định vị toàn cầu GPS hoạt động dựa trên các vệ tinh nhân tạo bay xoay quanh Trái Đất phát tín hiệu liên tục.'],
['Ứng dụng phổ biến của bản đồ số trong đời sống hằng ngày là',['tìm đường đi.','lưu địa chỉ nhà.','cập nhật kiến thức.','thu phóng bản đồ.'],'A','Bản đồ số tích hợp GPS giúp người dùng định vị và chỉ đường đi (Google Maps, Grab,...).'],
['Vật liệu cấu tạo nên vỏ Trái Đất là',['Khoáng vật và đá.','Khoáng vật và Macma.','Khoáng vật và sắt.','Đất và nước.'],'A','Vỏ Trái Đất được cấu tạo chủ yếu bởi các loại khoáng vật và 3 nhóm đá chính (macma, trầm tích, biến chất).'],
['Bộ phận vỏ đại dương thường không có tầng đá nào?',['Tầng trầm tích.','Tầng badan.','Tầng granit.','Tầng macma.'],'C','Vỏ đại dương mỏng hơn vỏ lục địa và không có tầng đá granit (chỉ bao gồm tầng trầm tích và tầng badan).'],
['Vỏ Trái Đất ở đại dương có độ dày khoảng',['50km.','5km.','70km.','100km.'],'B','Vỏ đại dương có độ dày trung bình từ 5 km đến 10 km (mỏng hơn nhiều so với vỏ lục địa dày tới 70 km).'],
['Vỏ Trái Đất được phân ra thành hai kiểu chính là',['lớp vỏ lục địa và lớp vỏ đại dương.','lớp Manti và lớp vỏ đại dương.','lớp vỏ lục địa và lớp Manti.','thạch quyển và lớp Manti.'],'A','Dựa vào vị trí và đặc điểm cấu tạo, vỏ Trái Đất chia làm 2 kiểu: Vỏ lục địa và Vỏ đại dương.'],
['Đá macma được hình thành',['từ dưới sâu nóng chảy, trào lên mặt đất nguội đi.','ở nơi trũng do sự lắng tụ và nén chặt các vật liệu.','từ trầm tích bị thay đổi tính chất do nhiệt độ cao.','từ đá biến chất bị thay đổi tính chất do sức nén lớn.'],'A','Đá macma sinh ra do khối macma nóng chảy trong lòng đất kết tinh hoặc trào ra bề mặt nguội cứng lại.'],
['Đá trầm tích được hình thành',['từ dưới sâu nóng chảy, trào lên mặt đất nguội đi.','ở nơi trũng do sự lắng tụ và nén chặt các vật liệu.','từ trầm tích bị thay đổi tính chất do nhiệt độ cao.','từ đá biến chất bị thay đổi tính chất do sức nén lớn.'],'B','Đá trầm tích tích tụ ở những vùng lõm do vật liệu vụn nát gắn kết và nén chặt qua thời gian dài.'],
['Để thể hiện các mỏ than trên lãnh thổ nước ta người ta thường dùng phương pháp',['kí hiệu đường chuyển động.','vùng phân bố.','kí hiệu.','chấm điểm.'],'C','Các mỏ khoáng sản (như mỏ than) là những điểm cụ thể nên dùng phương pháp kí hiệu (hình vuông màu đen).'],
['Để thể hiện số lượng đàn bò của các tỉnh ở nước ta người ta thường dùng phương pháp',['kí hiệu.','chấm điểm.','bản đồ - biểu đồ.','vùng phân bố.'],'C','Phương pháp bản đồ - biểu đồ đặt các biểu đồ cột/tròn vào phạm vi lãnh thổ từng tỉnh để thể hiện số lượng/quy mô.'],
['Dòng biển thường được biểu hiện bằng phương pháp',['đường chuyển động.','kí hiệu.','chấm điểm.','bản đồ - biểu đồ.'],'A','Dòng biển có hướng di chuyển rõ ràng trên đại dương nên phải dùng các mũi tên của phương pháp đường chuyển động.'],
['Giờ quốc tế được lấy theo giờ của',['múi giờ số 0.','múi giờ số 1.','múi giờ số 23.','múi giờ số 7.'],'A','Giờ quốc tế (GMT/UTC) quy ước lấy theo giờ mặt trời của múi giờ số 0 (có kinh tuyến gốc 0° đi qua kính thiên văn Greenwich).'],
['Đường chuyển ngày quốc tế được lấy theo kinh tuyến nào?',['0°.','180°.','90°T.','90°Đ.'],'B','Kinh tuyến 180° đi qua giữa Thái Bình Dương được quy ước làm đường chuyển ngày quốc tế.'],
['Các địa điểm thuộc các kinh tuyến khác nhau sẽ có giờ khác nhau gọi là',['giờ múi.','giờ địa phương.','giờ quốc tế.','giờ GMT.'],'B','Giờ địa phương (giờ Mặt Trời) là giờ riêng của từng kinh tuyến căn cứ vào vị trí Mặt Trời lên cao nhất.'],
['Lãnh thổ Việt Nam chủ yếu nằm trong múi giờ số mấy?',['5.','6.','7.','8.'],'C','Toàn bộ lãnh thổ đất liền Việt Nam nằm hoàn toàn trong múi giờ thứ 7 (GMT+7).'],
['Ngày nào sau đây ở vòng cực Bắc có thời gian ngày dài 24 giờ?',['21/3.','22/6.','23/9.','22/12.'],'B','Ngày Hạ chí 22/6, Bán cầu Bắc nghiêng nhiều nhất về phía Mặt Trời nên từ Vòng cực Bắc đến Cực Bắc có ngày dài 24 giờ.'],
['Ngày nào sau đây ở vòng cực Nam có thời gian ngày dài 24 giờ?',['21/3.','22/6.','23/9.','22/12.'],'D','Ngày Đông chí 22/12, Bán cầu Nam ngả về phía Mặt Trời nên khu vực Vòng cực Nam đến Cực Nam xuất hiện ngày dài 24 giờ.'],
['Ngày nào sau đây ở vòng cực Bắc có thời gian đêm dài 24 giờ?',['21/3.','22/6.','23/9.','22/12.'],'D','Ngày 22/12 Bán cầu Bắc chếch xa Mặt Trời nhất nên Vòng cực Bắc bị khuất hoàn toàn trong bóng tối (đêm 24h).'],

// HÀM VẼ BIỂU ĐỒ CỘT
function drawBarChart(canvasId){
  const cvs = document.getElementById(canvasId);
  const ctx = cvs.getContext('2d');
  const w = cvs.width, h = cvs.height;
  ctx.clearRect(0,0,w,h);
  
  ctx.fillStyle = '#00e5ff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('BIỂU ĐỒ THỂ HIỆN LƯỢNG MƯA TẠI SƠN LA, ĐÀ LẠT, HÀ NỘI NĂM 2024', w/2, 28);
  
  const padL = 70, padR = 40, padT = 60, padB = 60;
  ctx.strokeStyle = '#385878';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, h - padB);
  ctx.lineTo(w - padR, h - padB);
  ctx.stroke();
  
  ctx.fillStyle = '#a8efff';
  ctx.font = '12px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('(mm)', padL - 10, padT - 10);
  ctx.fillText('Địa điểm', w - padR, h - padB + 35);
  
  const maxVal = 2500;
  for(let v=0; v<=maxVal; v+=500){
    let y = (h - padB) - (v / maxVal) * (h - padB - padT);
    ctx.strokeStyle = '#183756';
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    
    ctx.fillStyle = '#8ea5be';
    ctx.textAlign = 'right';
    ctx.fillText(v, padL - 8, y + 4);
  }
  
  const data = [
    { label: 'Sơn La', val: 1758.5, color: '#00d88c' },
    { label: 'Đà Lạt', val: 2050.4, color: '#00e5ff' },
    { label: 'Hà Nội', val: '#ff4770', valNum: 1945.3 }
  ];
  
  const chartW = w - padL - padR;
  const colW = 60;
  const step = chartW / 3;
  
  const realData = [
    { label: 'Sơn La', val: 1758.5, color: '#00d88c' },
    { label: 'Đà Lạt', val: 2050.4, color: '#00e5ff' },
    { label: 'Hà Nội', val: 1945.3, color: '#ff4770' }
  ];

  realData.forEach((d, i) => {
    let x = padL + step*i + step/2 - colW/2;
    let barH = (d.val / maxVal) * (h - padB - padT);
    let y = (h - padB) - barH;
    
    ctx.fillStyle = d.color;
    ctx.fillRect(x, y, colW, barH);
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(d.val, x + colW/2, y - 8);
    
    ctx.fillStyle = '#a8efff';
    ctx.font = '13px Arial';
    ctx.fillText(d.label, x + colW/2, h - padB + 20);
  });
}

// HÀM VẼ BIỂU ĐỒ ĐƯỜNG
function drawLineChart(canvasId){
  const cvs = document.getElementById(canvasId);
  const ctx = cvs.getContext('2d');
  const w = cvs.width, h = cvs.height;
  ctx.clearRect(0,0,w,h);
  
  ctx.fillStyle = '#00e5ff';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('BIỂU ĐỒ THỂ HIỆN SỰ THAY ĐỔI SỐ GIỜ NẮNG CÁC THÁNG NĂM 2024 TẠI HÀ NỘI', w/2, 25);
  
  const padL = 60, padR = 40, padT = 55, padB = 60;
  ctx.strokeStyle = '#385878';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, h - padB);
  ctx.lineTo(w - padR, h - padB);
  ctx.stroke();
  
  ctx.fillStyle = '#a8efff';
  ctx.font = '12px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('(giờ)', padL - 10, padT - 10);
  ctx.fillText('Tháng', w - padR, h - padB + 35);
  
  const maxVal = 200;
  for(let v=0; v<=maxVal; v+=50){
    let y = (h - padB) - (v / maxVal) * (h - padB - padT);
    ctx.strokeStyle = '#183756';
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    
    ctx.fillStyle = '#8ea5be';
    ctx.textAlign = 'right';
    ctx.fillText(v, padL - 8, y + 4);
  }
  
  const data = [33.2, 45.2, 56.3, 101.9, 100.9, 127.9, 137.0, 144.6, 118.4, 183.4, 146.3, 82.1];
  const chartW = w - padL - padR;
  const step = chartW / (data.length - 1);
  
  let points = [];
  data.forEach((val, i) => {
    let x = padL + step * i;
    let y = (h - padB) - (val / maxVal) * (h - padB - padT);
    points.push({x, y, val, month: i + 1});
  });
  
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  points.forEach((p, i) => {
    if(i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
  
  points.forEach((p) => {
    ctx.fillStyle = '#ff304e';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.val, p.x, p.y - 10);
    
    ctx.fillStyle = '#a8efff';
    ctx.font = '12px Arial';
    ctx.fillText('T' + p.month, p.x, h - padB + 20);
  });
}

// NỀN HIỆU ỨNG CANVAS
const c=document.getElementById('bg'),x=c.getContext('2d');
let w,h,P=[];
function rs(){
  w=c.width=innerWidth*devicePixelRatio;
  h=c.height=innerHeight*devicePixelRatio;
  P=Array.from({length:100},()=>({
    x:Math.random()*w,
    y:Math.random()*h,
    r:.5+Math.random()*2,
    vx:(Math.random()-.5)*.35,
    vy:(Math.random()-.5)*.35,
    e:Math.random()>.72
  }));
}
function loop(){
  x.clearRect(0,0,w,h);
  P.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=w; if(p.x>w)p.x=0;
    if(p.y<0)p.y=h; if(p.y>h)p.y=0;
    x.beginPath();
    x.arc(p.x,p.y,p.r*(p.e?1.5:1),0,7);
    x.fillStyle=p.e?'#00e5ff99':'#ff477088';
    x.fill();
  });
  requestAnimationFrame(loop);
}
onresize=rs; rs(); loop();
</script>
