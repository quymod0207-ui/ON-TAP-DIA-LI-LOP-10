const F=[
  ['1','<b>Cho bảng số liệu:</b><br>Tổng lượng mưa tại trạm quan trắc Sơn La, Đà Lạt, Hà Nội năm 2024 (Đơn vị: mm)<br><i>(Sơn La: 1758,5 | Đà Lạt: 2050,4 | Hà Nội: 1945,3)</i><br><b>Yêu cầu:</b> Theo bảng số liệu, hãy vẽ biểu đồ cột thể hiện lượng mưa tại một số địa điểm trên năm 2024.','caut1',drawBarChart],

function drawBarChart(canvasId){
  const cvs = document.getElementById(canvasId);
  const ctx = cvs.getContext('2d');
  const w = cvs.width, h = cvs.height;
  
  ctx.clearRect(0,0,w,h);
  
  // Title
  ctx.fillStyle = '#00e5ff';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('BIỂU ĐỒ THỂ HIỆN LƯỢNG MƯA TẠI SƠN LA, ĐÀ LẠT, HÀ NỘI NĂM 2024', w/2, 30);
  
  // Axes
  const padL = 70, padR = 40, padT = 70, padB = 60;
  ctx.strokeStyle = '#385878';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, h - padB);
  ctx.lineTo(w - padR, h - padB);
  ctx.stroke();
  
  // Unit
  ctx.fillStyle = '#a8efff';
  ctx.font = '12px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('(mm)', padL - 10, padT - 10);
  ctx.fillText('Địa điểm', w - padR, h - padB + 35);
  
  // Y Axis ticks (0 -> 2500)
  const maxVal = 2500;
  for(let v=0; v<=maxVal; v+=500){
    let y = (h - padB) - (v / maxVal) * (h - padB - padT);
    ctx.strokeStyle = '#183756';
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    
    ctx.fillStyle = '#8ea5be';
    ctx.textAlign = 'right';
    ctx.fillText(v, padL - 8, y + 4);
  }
  
  // Data
  const data = [
    { label: 'Sơn La', val: 1758.5, color: '#00d88c' },
    { label: 'Đà Lạt', val: 2050.4, color: '#00e5ff' },
    { label: 'Hà Nội', val: 1945.3, color: '#ff4770' }
  ];
  
  const chartW = w - padL - padR;
  const colW = 60;
  const step = chartW / data.length;
  
  data.forEach((d, i) => {
    let x = padL + step*i + step/2 - colW/2;
    let barH = (d.val / maxVal) * (h - padB - padT);
    let y = (h - padB) - barH;
    
    // Draw Bar
    ctx.fillStyle = d.color;
    ctx.fillRect(x, y, colW, barH);
    
    // Value text
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(d.val, x + colW/2, y - 8);
    
    // Label
    ctx.fillStyle = '#a8efff';
    ctx.font = '13px Arial';
    ctx.fillText(d.label, x + colW/2, h - padB + 20);
  });
}

function drawLineChart(canvasId){
  const cvs = document.getElementById(canvasId);
  const ctx = cvs.getContext('2d');
  const w = cvs.width, h = cvs.height;
  
  ctx.clearRect(0,0,w,h);
  
  // Title
  ctx.fillStyle = '#00e5ff';
  ctx.font = 'bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('BIỂU ĐỒ THỂ HIỆN SỰ THAY ĐỔI SỐ GIỜ NẮNG CÁC THÁNG NĂM 2024 TẠI HÀ NỘI', w/2, 25);
  
  // Axes
  const padL = 60, padR = 40, padT = 60, padB = 60;
  ctx.strokeStyle = '#385878';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, h - padB);
  ctx.lineTo(w - padR, h - padB);
  ctx.stroke();
  
  // Unit
  ctx.fillStyle = '#a8efff';
  ctx.font = '12px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('(giờ)', padL - 10, padT - 10);
  ctx.fillText('Tháng', w - padR, h - padB + 35);
  
  // Y Axis ticks (0 -> 200)
  const maxVal = 200;
  for(let v=0; v<=maxVal; v+=50){
    let y = (h - padB) - (v / maxVal) * (h - padB - padT);
    ctx.strokeStyle = '#183756';
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(w - padR, y);
    ctx.stroke();
    
    ctx.fillStyle = '#8ea5be';
    ctx.textAlign = 'right';
    ctx.fillText(v, padL - 8, y + 4);
  }
  
  // Data
  const data = [33.2, 45.2, 56.3, 101.9, 100.9, 127.9, 137.0, 144.6, 118.4, 183.4, 146.3, 82.1];
  const chartW = w - padL - padR;
  const step = chartW / (data.length - 1);
  
  let points = [];
  data.forEach((val, i) => {
    let x = padL + step * i;
    let y = (h - padB) - (val / maxVal) * (h - padB - padT);
    points.push({x, y, val, month: i + 1});
  });
  
  // Draw Line
  ctx.strokeStyle = '#00e5ff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  points.forEach((p, i) => {
    if(i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });
  ctx.stroke();
  
  // Draw Points & Text
  points.forEach((p) => {
    // Point
    ctx.fillStyle = '#ff304e';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
    ctx.fill();
    
    // Value text
    ctx.fillStyle = '#ffffff';
    ctx.font = '11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(p.val, p.x, p.y - 10);
    
    // Month Label
    ctx.fillStyle = '#a8efff';
    ctx.font = '12px Arial';
    ctx.fillText('T' + p.month, p.x, h - padB + 20);
  });
}

function pg(n,b){

make1(); make2(); make3(); make4();

const c=document.getElementById('bg'),x=c.getContext('2d');
let w,h,P=[];
function rs(){
  w=c.width=innerWidth*devicePixelRatio;
  h=c.height=innerHeight*devicePixelRatio;
  P=Array.from({length:100},()=>({
    x:Math.random()*w,
    y:Math.random()*h,
    r:.5+Math.random()*2,
    vx:(Math.random()-.5)*.35,
    vy:(Math.random()-.5)*.35,
    e:Math.random()>.72
  }));
}
function loop(){
  x.clearRect(0,0,w,h);
  P.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0)p.x=w; if(p.x>w)p.x=0;
    if(p.y<0)p.y=h; if(p.y>h)p.y=0;
    x.beginPath();
    x.arc(p.x,p.y,p.r*(p.e?1.5:1),0,7);
    x.fillStyle=p.e?'#00e5ff99':'#ff477088';
    x.fill();
  });
  requestAnimationFrame(loop);
}
onresize=rs; rs(); loop();
</script>
